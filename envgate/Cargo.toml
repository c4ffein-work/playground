[package]
name = "envgate"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A small reverse proxy built on Pingora, configured only by environment variables, with built-in ACME certificates"

[dependencies]
arc-swap = "1.9"
async-trait = "0.1"
bytes = "1"
env_logger = { version = "0.11", default-features = false, features = ["humantime"] }
http = "1"
instant-acme = { version = "0.8.5", default-features = false, features = ["ring", "hyper-rustls", "rcgen"] }
log = "0.4"
pingora = { version = "0.9.1", default-features = false, features = ["proxy", "rustls"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "fs", "macros"] }
x509-parser = "0.18"

[profile.release]
lto = "thin"
strip = true
