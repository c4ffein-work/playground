<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Charity Trail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
/* Layout idea: a public ledger you can walk. Summary on top, then the money's path, hop by hop, down to the deed and its proof. */
:root {
  --bg: #f2f5f5;
  --surface: #ffffff;
  --ink: #14222a;
  --muted: #586a72;
  --line: #d6dfe1;
  --accent: #0a6c88;
  --accent-soft: #e2f0f4;
  --ok: #2b7a4e;
  --ok-soft: #e3f2e9;
  --warn: #9a630f;
  --warn-soft: #f8edd9;
  --bad: #b03636;
  --bad-soft: #f8e3e3;
  --font-display: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --c1: #0a6c88;
  --c2: #7a52c7;
  --c3: #b5541e;
  --radius: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e161b; --surface: #152127; --ink: #e2ebee; --muted: #93a6ae; --line: #263840;
    --accent: #52b6d4; --accent-soft: #15313b; --ok: #62c48f; --ok-soft: #15301f;
    --warn: #e2a64c; --warn-soft: #33270f; --bad: #ee7d7d; --bad-soft: #3a1b1b;
    --c1: #52b6d4; --c2: #a98be8; --c3: #e58a55;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e161b; --surface: #152127; --ink: #e2ebee; --muted: #93a6ae; --line: #263840;
  --accent: #52b6d4; --accent-soft: #15313b; --ok: #62c48f; --ok-soft: #15301f;
  --warn: #e2a64c; --warn-soft: #33270f; --bad: #ee7d7d; --bad-soft: #3a1b1b;
  --c1: #52b6d4; --c2: #a98be8; --c3: #e58a55;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font: 15px/1.55 var(--font-body);
  -webkit-text-size-adjust: 100%;
}
h1, h2, h3 { font-family: var(--font-display); line-height: 1.15; text-wrap: balance; margin: 0; }
h1 { font-size: 28px; font-weight: 700; }
h2 { font-size: 21px; font-weight: 600; }
h3 { font-size: 17px; font-weight: 600; }
p { margin: 0; max-width: 65ch; }
a { color: var(--accent); }
button, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.mono, code { font-family: var(--font-mono); font-size: 0.86em; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 13px; }

.top {
  position: sticky; top: 0; z-index: 5;
  background: var(--bg); border-bottom: 1px solid var(--line);
}
.top-inner { max-width: 980px; margin: 0 auto; padding: 12px 16px 0; display: grid; gap: 10px; }
.brand { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.brand b { font-family: var(--font-display); font-size: 20px; letter-spacing: 0.01em; }
.brand span { color: var(--muted); font-size: 13px; }
nav { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
nav a {
  text-decoration: none; color: var(--muted); padding: 8px 12px 10px; white-space: nowrap;
  border-bottom: 2px solid transparent; font-weight: 500;
}
nav a[aria-current="page"] { color: var(--ink); border-color: var(--accent); }

main { max-width: 980px; margin: 0 auto; padding: 20px 16px 64px; display: grid; gap: 22px; }
.demo-note {
  font-size: 13px; color: var(--warn); background: var(--warn-soft);
  border-radius: var(--radius); padding: 8px 12px;
}
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: grid; gap: 12px; min-width: 0; }
.stack { display: grid; gap: 12px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.between { justify-content: space-between; }
.grid2 { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }

.pill {
  display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 1px 9px;
  font-size: 12px; font-weight: 600; white-space: nowrap; border: 1px solid transparent;
}
.pill.ok { color: var(--ok); background: var(--ok-soft); }
.pill.warn { color: var(--warn); background: var(--warn-soft); }
.pill.bad { color: var(--bad); background: var(--bad-soft); }
.pill.info { color: var(--accent); background: var(--accent-soft); }
.pill.plain { color: var(--muted); border-color: var(--line); }
.who { font-weight: 600; }
.badge { color: var(--ok); font-size: 12px; font-weight: 600; white-space: nowrap; }
.badge.no { color: var(--bad); }

/* Hero / summary */
.hero { display: grid; gap: 14px; }
.picker { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.picker label { color: var(--muted); font-size: 13px; }
select {
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; max-width: 100%;
}
.lead { font-size: 19px; line-height: 1.4; max-width: 46ch; font-family: var(--font-display); font-weight: 500; }
.lead strong { font-weight: 700; }
.tiles { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.tile { border-left: 4px solid var(--c); background: var(--surface); border-radius: 0 var(--radius) var(--radius) 0; padding: 10px 12px; display: grid; gap: 2px; }
.tile b { font-family: var(--font-display); font-size: 22px; font-weight: 700; }
.tile span { color: var(--muted); font-size: 13px; }
.bar { display: flex; height: 12px; border-radius: 6px; overflow: hidden; background: var(--line); gap: 2px; }
.bar i { display: block; background: var(--c); min-width: 3px; }

/* Sankey */
.flow-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: var(--radius); }
.flow-wrap svg { display: block; }
.flow-wrap text { fill: var(--ink); font: 12px var(--font-body); }
.flow-wrap text.sub { fill: var(--muted); font: 11px var(--font-mono); }
.scroll-hint { font-size: 12px; color: var(--muted); }

/* Journey */
.journey { display: grid; gap: 0; }
.hop { display: grid; grid-template-columns: 22px 1fr; gap: 10px; }
.rail { display: grid; justify-items: center; grid-template-rows: 14px 1fr; }
.rail .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--c, var(--accent)); margin-top: 6px; }
.rail .line { width: 2px; background: var(--line); }
.hop:last-child .rail .line { background: transparent; }
.hop-body { padding-bottom: 16px; display: grid; gap: 8px; min-width: 0; }
.hop-title { display: flex; gap: 8px; flex-wrap: wrap; align-items: baseline; }
.hop-title h3 { font-size: 16px; }
.amount { font-family: var(--font-display); font-weight: 700; font-size: 18px; }
.indent { margin-left: 14px; padding-left: 14px; border-left: 2px dashed var(--line); }
.sig { display: flex; gap: 6px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.sig .chip { border: 1px solid var(--line); border-radius: 6px; padding: 1px 7px; background: var(--bg); color: var(--ink); cursor: pointer; }
.sig .chip:hover { border-color: var(--accent); }

.deed-mini { display: grid; grid-template-columns: 112px 1fr; gap: 12px; text-decoration: none; color: inherit; border: 1px solid var(--line); border-radius: var(--radius); padding: 8px; background: var(--bg); }
.deed-mini:hover { border-color: var(--accent); }
.deed-mini img { width: 112px; height: 74px; object-fit: cover; border-radius: 6px; display: block; }
.deed-mini b { font-family: var(--font-display); font-size: 16px; }

/* Deed page */
.gallery { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
.gallery figure { margin: 0; display: grid; gap: 6px; }
.gallery img { width: 100%; height: auto; border-radius: 8px; display: block; border: 1px solid var(--line); cursor: zoom-in; }
.gallery figcaption { font-size: 12px; color: var(--muted); display: grid; gap: 2px; }
.check { font-size: 12px; font-weight: 600; }
.check.ok { color: var(--ok); }
.check.bad { color: var(--bad); }
.check.wait { color: var(--muted); }
pre.doc { white-space: pre-wrap; font: 14px/1.55 var(--font-body); margin: 0; background: var(--bg); border-radius: 8px; padding: 12px; max-width: 70ch; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; font-size: 13px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.votes { display: grid; gap: 8px; }
.vote { display: grid; grid-template-columns: 26px 1fr; gap: 8px; align-items: start; }
.post .mark, .vote .mark { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 13px; }
.mark.yes { background: var(--ok-soft); color: var(--ok); }
.mark.no { background: var(--bad-soft); color: var(--bad); }
.cells svg { max-width: 100%; height: auto; display: block; }
.cells text { font: 11px var(--font-body); fill: var(--muted); }

/* Events */
.ms { border-top: 1px solid var(--line); padding-top: 12px; display: grid; gap: 6px; }
.ms:first-of-type { border-top: 0; padding-top: 0; }
.note { border-left: 3px solid var(--c, var(--line)); padding: 4px 10px; font-size: 13px; background: var(--bg); border-radius: 0 6px 6px 0; }

/* Charts, discussion, curators */
.chart svg { display: block; width: 100%; height: auto; }
.chart text { font: 11px var(--font-body); fill: var(--muted); }
.chart text.v { fill: var(--ink); font-weight: 600; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; background: var(--c); margin-right: 5px; vertical-align: -1px; }
.split { display: grid; gap: 6px; }
.split-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; font-size: 14px; }
.split-bar { grid-column: 1 / -1; height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
.split-bar i { display: block; height: 100%; background: var(--c); }
.history { display: grid; gap: 8px; border-left: 2px solid var(--line); padding-left: 12px; font-size: 14px; }
.lanes { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }
.lane { border: 1px solid var(--line); border-radius: 8px; padding: 10px; display: grid; gap: 4px; background: var(--bg); }
.lane b { font-family: var(--font-display); font-size: 18px; }
.tug { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--line); }
.tug i { display: block; background: var(--c); }
.post { display: grid; grid-template-columns: 26px 1fr; gap: 8px; align-items: start; }
.post .mark.zero { background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
.weight { font-size: 12px; color: var(--muted); }
.weight b { color: var(--ink); }
details > summary { cursor: pointer; color: var(--accent); font-size: 13px; }
pre.code { margin: 0; background: var(--bg); border-radius: 8px; padding: 10px; overflow-x: auto; font: 12px/1.5 var(--font-mono); }

/* Rules */
.blocked { display: grid; grid-template-columns: 4px 1fr; gap: 12px; }
.blocked::before { content: ""; background: var(--bad); border-radius: 2px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 500; }
.table-wrap { overflow-x: auto; }

.btn {
  border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 5px 11px; cursor: pointer; font-size: 13px;
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.linkish { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; text-decoration: underline; font-size: inherit; }

dialog {
  border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--ink);
  width: min(720px, calc(100% - 24px)); max-height: calc(100% - 48px); padding: 0;
}
dialog::backdrop { background: rgba(8, 16, 20, 0.55); }
.dlg { display: grid; gap: 12px; padding: 16px; }
.dlg img { width: 100%; height: auto; border-radius: 8px; }

@media (max-width: 420px) {
  h1 { font-size: 24px; }
  .lead { font-size: 17px; }
  .deed-mini { grid-template-columns: 88px 1fr; }
  .deed-mini img { width: 88px; height: 60px; }
}
@media (prefers-reduced-motion: no-preference) {
  .card, .hop { animation: rise 0.25s ease-out both; }
  @keyframes rise { from { transform: translateY(4px); } to { transform: none; } }
}
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="brand"><b>Charity Trail</b><span>Follow a donation to the work it paid for</span></div>
    <nav aria-label="Sections">
      <a href="#trace">Your money</a>
      <a href="#impact">Impact</a>
      <a href="#events">Events</a>
      <a href="#curators">Curators</a>
      <a href="#rules">How it works</a>
    </nav>
  </div>
</header>
<main id="app"><p class="muted">Loading the public trail…</p></main>
<dialog id="dlg" aria-labelledby="dlg-title"><div class="dlg" id="dlg-body"></div></dialog>
<script src="data.js"></script>
<script src="flow.js"></script>
<script src="app.js"></script>
</body>
</html>
