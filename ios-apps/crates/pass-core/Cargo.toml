[package]
name = "pass-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "A password-store (the standard Unix `pass`: OpenPGP files in a git repository), exposed to Swift through UniFFI"

[lib]
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
# Pure Rust git: the object database, references, the index. No network (the sync is files in a
# drop zone), no worktree or diff machinery (a store is small and flat: src/git.rs does it).
gix = { version = "0.91", default-features = false, features = ["index", "sha1"] }
# Reading the pack of a received bundle into the object database.
gix-pack = { version = "0.78", default-features = false, features = ["streaming-input"] }
# Pure Rust OpenPGP. No bzip2: pass writes uncompressed messages, gpg's default is zlib.
pgp = { version = "0.21", default-features = false }
rand = "0.8"
# The generation of `rand` that russh and its key types are on.
rand10 = { package = "rand", version = "0.10" }
ring = "0.17"
# Pure Rust SSH client, on ring. No RSA: the device key is Ed25519, and so is the drop zone's host key.
russh = { version = "0.65", default-features = false, features = ["ring"] }
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["rt", "net", "time", "sync", "macros"] }
uniffi = "0.32"
zeroize = "1.8"
