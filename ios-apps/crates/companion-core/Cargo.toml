[package]
name = "companion-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Client for a companion server (github.com/c4ffein/companion), exposed to Swift through UniFFI"

[lib]
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
pinned-http = { path = "../pinned-http" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uniffi = "0.32"
ureq = { version = "2.12", default-features = false, features = ["tls"] }
