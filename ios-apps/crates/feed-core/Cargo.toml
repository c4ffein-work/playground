[package]
name = "feed-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "RSS/Atom fetching, parsing and HTML sanitizing (from github.com/c4ffein/feed), exposed to Swift through UniFFI"

[lib]
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
pinned-http = { path = "../pinned-http" }
# The XML parser: read-only tree, no dependency of its own, no external entities.
roxmltree = "0.21"
thiserror = "2"
uniffi = "0.32"
ureq = { version = "2.12", default-features = false, features = ["tls"] }
# Already there through ureq: to resolve a redirect or a relative link, and to compare hosts.
url = "2.5"
