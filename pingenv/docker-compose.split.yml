# Example: the same image twice. `edge` terminates TLS and routes; `files`
# only serves a directory. Updating the site restarts `files` alone, so the
# edge keeps its connections and its other routes stay up.
services:
  edge:
    build: .
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - pingenv-data:/data
    environment:
      PINGENV_TLS_MODE: acme
      PINGENV_ACME_STAGING: "true" # remove once it works, to get trusted certificates

      PINGENV_ROUTE_SITE_HOST: example.com
      PINGENV_ROUTE_SITE_UPSTREAM: files:80

      PINGENV_ROUTE_API_HOST: example.com
      PINGENV_ROUTE_API_PATH: /api
      PINGENV_ROUTE_API_STRIP_PREFIX: "true"
      PINGENV_ROUTE_API_UPSTREAM: api:8080

  files:
    build: .
    restart: unless-stopped
    volumes:
      - ./site:/srv/site:ro
    environment:
      # No TLS here: only the edge is reachable from outside. The host must
      # match the edge's, because the client's Host header is passed through.
      PINGENV_ROUTE_SITE_HOST: example.com
      PINGENV_ROUTE_SITE_ROOT: /srv/site

  api:
    image: traefik/whoami
    command: ["--port=8080"]

volumes:
  pingenv-data:
